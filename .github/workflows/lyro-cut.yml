name: LYRO Cut macOS
on:
  push:
    branches: [lyro-cut]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test project model
        run: |
          mkdir -p .build
          xcrun swiftc -swift-version 5 -parse-as-library Sources/Model.swift Tests/ModelTests.swift -o .build/model-tests
          .build/model-tests
      - name: Test real media rendering and MP4 export
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library Sources/Model.swift Sources/Render.swift Tests/RenderTests.swift -o .build/render-tests
          .build/render-tests
      - name: Install disk image designer
        run: brew install create-dmg
      - name: Build and sign universal application
        run: bash scripts/build.sh
      - name: Upload Mac application
        uses: actions/upload-artifact@v4
        with:
          name: LYRO-Cut-0.6.1-macOS
          path: |
            dist/LYRO-Cut-0.6.1-macOS.zip
            dist/LYRO-Cut-0.6.1.dmg
          if-no-files-found: error
      - name: Publish versioned update package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          tag="lyro-cut-v$version"
          zip="LYRO-Cut-$version-macOS.zip"
          (cd dist && shasum -a 256 "$zip" > "$zip.sha256")
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; immutable update package retained."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "LYRO Cut $version" --notes "LYRO Cut $version — universal macOS build, model and render tests passed." "dist/$zip" "dist/$zip.sha256" "dist/LYRO-Cut-$version.dmg"
          fi
