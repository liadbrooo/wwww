name: LYRO Cut Windows
on:
  push:
    branches: [lyro-cut-windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate branded installer artwork
        run: |
          python -m pip install Pillow
          python windows/brand.py
      - name: Prepare local frontend
        working-directory: windows
        run: |
          npm install
          node prepare.mjs
          node --check dist/desktop.js
          node --check dist/updates.js
          node --check dist/app.js
      - name: Install test encoder
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $env:Path += ";C:\ProgramData\chocolatey\bin"
          }
          ffmpeg -version
          ffprobe -version
      - name: Test native Rust renderer and UHD export
        working-directory: windows/src-tauri
        run: cargo test -- --nocapture
      - name: Build Windows x64 installer
        working-directory: windows
        run: npm run build
      - name: Verify compiled Windows executable
        shell: pwsh
        run: |
          $exe = Get-Item windows/src-tauri/target/release/lyro-cut.exe
          if ($exe.Length -lt 100000) { throw "Invalid Windows executable" }
          $stream = [System.IO.File]::OpenRead($exe.FullName)
          try {
            if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Invalid PE signature" }
          } finally { $stream.Dispose() }
      - name: Prepare Windows packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          $setup = Get-ChildItem windows/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (!$setup) { throw "NSIS installer missing" }
          Copy-Item $setup.FullName release/LYRO-Cut-0.7.1-Windows-x64-Setup.exe
          Compress-Archive -Path windows/src-tauri/target/release/lyro-cut.exe -DestinationPath release/LYRO-Cut-0.7.1-Windows-x64-Portable.zip
          Get-ChildItem release -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File -Encoding ascii -Append release/SHA256SUMS.txt }
      - uses: actions/upload-artifact@v4
        with:
          name: LYRO-Cut-0.7.1-Windows-x64
          path: release/*
          if-no-files-found: error
  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LYRO-Cut-0.7.1-Windows-x64
          path: release
      - name: Verify release package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd release && sha256sum -c SHA256SUMS.txt)
          tag=lyro-cut-windows-v0.7.1
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Version already published; retain immutable files."
          else
            gh release create "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "LYRO Cut Windows 0.7.1" --notes "Windows Foundation with integrated SHA-256 verified updater. FFmpeg optional. Unsigned preview build." release/LYRO-Cut-0.7.1-Windows-x64-Setup.exe release/LYRO-Cut-0.7.1-Windows-x64-Portable.zip release/SHA256SUMS.txt
          fi
